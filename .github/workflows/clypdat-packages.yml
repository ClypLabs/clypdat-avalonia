name: ClypDat Windows packages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clypdat-packages-main
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore targeted package graph
        shell: pwsh
        run: dotnet restore build/ClypDat.Win32Packages.proj -p:AvsSkipBuildingLegacyTargetFrameworks=True

      - name: Build and test targeted package graph
        shell: pwsh
        run: |
          $height = (git rev-list --count HEAD).Trim()
          $sha = (git rev-parse --short=12 HEAD).Trim()
          $version = "12.2.1000-clypdat.$height.$sha"
          "package_version=$version" >> $env:GITHUB_OUTPUT
          "commit_height=$height" >> $env:GITHUB_OUTPUT
          "commit_sha=$sha" >> $env:GITHUB_OUTPUT
          dotnet msbuild build/ClypDat.Win32Packages.proj /t:Pack /p:ClypDatPackageVersion=$version /p:ClypDatPackageOutput=$pwd/artifacts/nuget
        id: package

      - name: Run Win32 layered-opacity tests
        shell: pwsh
        run: dotnet run --project tests/Avalonia.IntegrationTests.Win32/Avalonia.IntegrationTests.Win32.csproj -c Release -f net10.0 -p:AvsSkipBuildingLegacyTargetFrameworks=True

      - name: Verify package smoke set and manifest
        shell: pwsh
        run: |
          $expected = "${{ steps.package.outputs.package_version }}"
          $expectedIds = @(
            'Avalonia',
            'Avalonia.Base',
            'Avalonia.Controls',
            'Avalonia.Controls.Media',
            'Avalonia.DesignerSupport',
            'Avalonia.Desktop',
            'Avalonia.Dialogs',
            'Avalonia.Fonts.Inter',
            'Avalonia.FreeDesktop',
            'Avalonia.FreeDesktop.AtSpi',
            'Avalonia.HarfBuzz',
            'Avalonia.Markup',
            'Avalonia.Markup.Xaml',
            'Avalonia.Metal',
            'Avalonia.MicroCom',
            'Avalonia.Native',
            'Avalonia.OpenGL',
            'Avalonia.Remote.Protocol',
            'Avalonia.Skia',
            'Avalonia.Themes.Fluent',
            'Avalonia.Vulkan',
            'Avalonia.Win32',
            'Avalonia.Win32.Automation',
            'Avalonia.X11'
          )
          $files = Get-ChildItem artifacts/nuget -Filter *.nupkg -File
          $actualNames = @($files.BaseName | Sort-Object)
          $expectedNames = @($expectedIds | ForEach-Object { "$_.$expected" } | Sort-Object)
          if (($actualNames -join '|') -ne ($expectedNames -join '|')) {
            throw "Targeted package set mismatch. Expected: $($expectedNames -join ', '); actual: $($actualNames -join ', ')."
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packageIds = @{}
          $entries = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $archive = [IO.Compression.ZipFile]::OpenRead($file.FullName)
            try {
              $nuspec = $archive.Entries | Where-Object FullName -like '*.nuspec' | Select-Object -First 1
              if ($null -eq $nuspec) { throw "Package $($file.Name) has no nuspec." }
              $reader = [IO.StreamReader]::new($nuspec.Open())
              try { $metadata = ([xml]$reader.ReadToEnd()).package.metadata }
              finally { $reader.Dispose() }
              if ($metadata.version -ne $expected) { throw "Package $($file.Name) has version $($metadata.version), expected $expected." }
              $packageIds[$metadata.id] = $true
              foreach ($dependency in (@($metadata.dependencies.group.dependency) + @($metadata.dependencies.dependency))) {
                if ($dependency.id -like 'Avalonia*' -and $dependency.version -eq $expected -and -not $packageIds.ContainsKey($dependency.id)) {
                  $dependencyPath = Join-Path artifacts/nuget "$($dependency.id).$expected.nupkg"
                  if (-not (Test-Path -LiteralPath $dependencyPath -PathType Leaf)) {
                    throw "Package $($file.Name) references same-version Avalonia dependency $($dependency.id), which is missing."
                  }
                }
              }
            }
            finally { $archive.Dispose() }
            [ordered]@{ name = $file.Name; size = $file.Length; sha256 = $hash }
          }
          foreach ($id in $expectedIds) {
            if (-not $packageIds.ContainsKey($id)) { throw "Package metadata id $id is missing." }
          }
          [ordered]@{ schema = 1; repository = "ClypLabs/clypdat-avalonia"; commit = "${{ github.sha }}"; packageVersion = $expected; packages = @($entries) } |
            ConvertTo-Json -Depth 5 | Set-Content artifacts/nuget/manifest.json -Encoding utf8
          Compress-Archive -Path artifacts/nuget/* -DestinationPath Avalonia-ClypDat-Packages.zip

      - name: Upload immutable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-packages-${{ github.sha }}
          path: Avalonia-ClypDat-Packages.zip
          if-no-files-found: error
          retention-days: 14

      - name: Trigger ClypDat Dev build
        env:
          GH_TOKEN: ${{ secrets.CLYPDAT_DEV_DISPATCH_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "CLYPDAT_DEV_DISPATCH_TOKEN is not configured." }
          gh api repos/ClypLabs/ClypDat/actions/workflows/dev-build.yml/dispatches `
            -f ref=master `
            -f "inputs[avalonia_commit]=${{ github.sha }}" `
            -f "inputs[package_version]=${{ steps.package.outputs.package_version }}" `
            -f "inputs[avalonia_run_id]=${{ github.run_id }}" `
            -f "inputs[artifact_name]=avalonia-packages-${{ github.sha }}"
